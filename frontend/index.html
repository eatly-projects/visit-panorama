<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F0852F" />
    <title>Tamu Panorama Building</title>
    <script>
      // Pasang mode gelap/terang sebelum halaman tampil supaya tidak berkedip.
      // Bawaannya mode terang (permintaan Lutfi); mode gelap hanya kalau
      // pengguna pernah memilihnya lewat tombol.
      (function () {
        try {
          if (localStorage.getItem('tema') === 'gelap') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
