<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F0852F" />
    <title>Tamu Panorama Head Office</title>
    <script>
      // Pasang mode gelap/terang sebelum halaman tampil supaya tidak berkedip.
      (function () {
        try {
          var saved = localStorage.getItem('tema');
          var dark = saved ? saved === 'gelap' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
